server {
    listen 80;
    server_name kittygrammmyapr.servecounterstrike.com;
    server_tokens off;
    client_max_body_size 10M;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name kittygrammmyapr.servecounterstrike.com;

    ssl_certificate /etc/letsencrypt/live/kittygrammmyapr.servecounterstrike.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kittygrammmyapr.servecounterstrike.com/privkey.pem;

    location /api/docs/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/redoc.html;
    }
    location /api/ {
        proxy_set_header Host $http_host;
        proxy_pass http://backend:8000/api/;
    }

    location /admin/ {
        proxy_set_header Host $http_host;
        proxy_pass http://backend:8000/admin/;
    }

    location /s/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
       proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/admin/ {
        alias /static/admin/;
    }

    location /static/rest_framework/ {
        alias /static/rest_framework/;
    }
        
    location /media/ {
        alias /media/;
    }
    
    location / {
        root /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri /index.html;
      }
}
